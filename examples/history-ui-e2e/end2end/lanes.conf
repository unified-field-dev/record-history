# Settings for run-lanes.sh. Paths are relative to the repo root.
BUILD_CMD="cargo leptos build --project history-ui-e2e"   # as in ci.yml
PROFILE=release                    # the leptos block sets bin-profile-dev = "release"
SERVER_BIN=history-ui-e2e          # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=examples/history-ui-e2e/site
OUTPUT_NAME=history-ui-e2e
PORT=3000                          # lane i serves on PORT + 100 + i
READY_PATH=/health
SERVER_ENV=""
LANE_ENV=""                        # {port} is replaced with the lane's port
LANES_DEFAULT=1
