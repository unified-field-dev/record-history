[package]
name = "timeline-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Record-history host: audited model mutations + timeline under /history"

[lints]
workspace = true

[dependencies]
axum = { workspace = true, default-features = false, features = ["tokio", "http1", "json"] }
chrono = { workspace = true }
http-body-util = "0.1"
lepton = { workspace = true, features = ["ssr"] }
record-history = { path = "../../record-history", features = ["ssr"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
valence = { workspace = true }
